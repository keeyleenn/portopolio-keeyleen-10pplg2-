<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>keeyleen Portfolio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;

      /* 🔥 INI BAGIAN PENTING */
      background-image: url('Ye-on.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* overlay biar teks kebaca */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 182, 193, 0.3);
      z-index: -1;
    }

    .navbar {
      background: rgba(255, 182, 193, 0.85);
      backdrop-filter: blur(10px);
    }

    .navbar-brand, .nav-link {
      color: white !important;
      font-weight: bold;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      color: white;
    }

    .box {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 40px;
      margin-top: -80px;
    }

    .card {
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .hobby-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    footer {
      background: rgba(255,182,193,0.9);
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">my portopolio</a>
  </div>
</nav>

<div class="hero">
  <h1>Hi, I'm Keeyleen</h1>
  <p>I love cute things and kpop ✨</p>
</div>

<div class="container">
  <div class="box shadow">

    <h2 class="text-center mb-4">My Hobbies 🌸</h2>

    <div class="row text-center">

      <div class="col-md-4">
        <div class="card shadow">
          <img src="download (63).jpeg" class="hobby-img">
          <h5>Music 🎧</h5>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="photo aesthetic 🖤.jpeg" class="hobby-img">
          <h5>Take a selfie</h5>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="download (62).jpeg" class="hobby-img">
          <h5>Dancing</h5>
        </div>
      </div>

    </div>

  </div>
</div>

<footer>
  <p>Made by Keeyleen</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
